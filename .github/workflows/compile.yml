name: Build C++ Project
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install C/C++ compiler
        uses: rlalik/setup-cpp-compiler@master
        with:
          compiler: latest
      - name: Compile
        run: |
          SRC=$(find . -type f -name '*.cpp' | tr '\n' ' ')
          if [ -z "$SRC" ]; then
          echo "No .cpp files found in the repository."
          exit 1
          fi
          g++ -std=c++17 $SRC -o main
          - name: Show build output
            run: ls -la main

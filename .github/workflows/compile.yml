name: Build C++ Project
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install C/C++ compiler
        uses: rlalik/setup-cpp-compiler@master
        with:
          compiler: latest

      - name: Compile each .cpp to its own executable
        shell: bash
        run: |
          mkdir -p bin
          found=0
          while IFS= read -r -d '' src; do
            found=1
            exe="bin/$(basename "$src" .cpp)"
            echo "Compiling $src -> $exe"
            g++ -std=c++17 -Iinclude "$src" -o "$exe" || { echo "Compilation failed for $src"; exit 1; }
          done < <(find . -type f -name '*.cpp' -print0)
          if [ "$found" -eq 0 ]; then
            echo "No .cpp files found in the repository."
            exit 1
          fi

      - name: Run each executable and capture output
        shell: bash
        run: |
          mkdir -p outputs
          if ! compgen -G "bin/*" > /dev/null; then
            echo "No executables in bin/ to run."
            exit 0
          fi
          for exe in bin/*; do
            if [ ! -x "$exe" ]; then
              echo "Skipping non-executable $exe"
              continue
            fi
            name=$(basename "$exe")
            out="outputs/${name}.txt"
            echo "Running $exe -> $out"
            # Run with timeout to prevent infinite runs (timeout exit code will be recorded)
            timeout 10s "$exe" >"$out" 2>&1
            rc=$?
            echo -e "\n--- EXIT CODE: $rc ---" >> "$out"
            if [ $rc -eq 124 ]; then
              echo "Program timed out (exit code 124)" >> "$out"
            fi
          done

      - name: Show a short preview of outputs
        shell: bash
        run: |
          echo "Built executables:"
          ls -la bin || true
          echo ""
          echo "Outputs produced:"
          ls -la outputs || true
          echo ""
          # Print first 200 lines of each output for quick CI logs
          for f in outputs/*.txt; do
            echo "===== $f ====="
            sed -n '1,200p' "$f" || true
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            bin/**
            outputs/**

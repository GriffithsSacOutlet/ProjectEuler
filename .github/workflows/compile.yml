name: Build C++ Project
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install C/C++ compiler
        uses: rlalik/setup-cpp-compiler@master
        with:
          compiler: latest

      - name: Compile each .cpp to its own executable
        shell: bash
        run: |
          mkdir -p bin
          found=0
          while IFS= read -r -d '' src; do
            found=1
            exe="bin/$(basename "$src" .cpp)"
            echo "Compiling $src -> $exe"
            g++ -std=c++17 -Iinclude "$src" -o "$exe" || { echo "Compilation failed for $src"; exit 1; }
          done < <(find . -type f -name '*.cpp' -print0)
          if [ "$found" -eq 0 ]; then
            echo "No .cpp files found in the repository."
            exit 1
          fi

      - name: Show build output
        run: ls -la bin || true
